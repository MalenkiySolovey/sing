name: Solovey cache ownership

on:
  pull_request:
    branches: [solovey/extended-patches]
  push:
    branches: [solovey/extended-patches]

permissions:
  contents: read

jobs:
  cache-race:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - name: Packet cache ownership and affected bufio suite
        run: go test -race -count=1 -timeout=3m ./common/bufio
